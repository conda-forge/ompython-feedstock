context:
  version: "4.1.0"

package:
  name: ompython
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/O/OMPython/ompython-${{ version }}.tar.gz
  sha256: 5105d38e6449b642eed6633ebf3b6046d6a16e469130f7396f168b0b0e3a0063

build:
  noarch: python
  number: 0
  script: python -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy
    - psutil
    - pyparsing
    - pyzmq
  run_constraints:
    - openmodelica >=1.26

tests:
  - python:
      imports:
        - OMPython
      python_version: ${{ python_min }}.*
  - script:
      - python -c "from OMPython import OMCSessionZMQ; omc = OMCSessionZMQ(); print(omc.sendExpression('getVersion()'))"
    requirements:
      run:
        - openmodelica >=1.26

about:
  homepage: https://github.com/OpenModelica/OMPython
  license: LicenseRef-OSMC-PL
  license_file: LICENSE
  summary: "Python interface to OpenModelica."
  description: |
    OMPython is a Python interface that uses ZeroMQ to communicate with OpenModelica.
  repository: https://github.com/OpenModelica/OMPython

extra:
  recipe-maintainers:
    - adeas31
